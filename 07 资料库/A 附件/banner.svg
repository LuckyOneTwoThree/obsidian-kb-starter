<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Obsidian 知识库 Starter</title>
  <desc id="banner-desc">捕获优先、判断有落点、零社区插件的中文 Obsidian 知识库模板</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#E4DED1" stroke-width="1"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6F3EC" stop-opacity="1"/>
      <stop offset="0.62" stop-color="#F6F3EC" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#F6F3EC" stop-opacity="1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1F2933" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="#F6F3EC"/>
  <rect width="860" height="420" fill="url(#grid)"/>
  <rect width="1200" height="420" fill="url(#paper)"/>

